    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}


body{
    background:#ffffff;
    color:#222;
    line-height:1.5;
}
.navbar{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 80px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    z-index:999;
}

.logo{
    font-size:28px;
    font-weight:700;
    cursor:pointer;
}

.navLink{
    display:flex;
    gap:35px;
    list-style:none;
}

.navLink li a{
    text-decoration:none;
    color:#222;
    font-size:15px;
    font-weight:500;
    transition:.3s;
}

.navLink li a:hover{
    color:#777;
}

.nav-icons{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-icons i{
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

.nav-icons i:hover{
    color:#777;
}
.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:0.3s;
    cursor:pointer;
    text-align:center;
    padding:20px;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 20px rgba(0,0,0,.12);
}

.card img{
    width:100%;
    height:280px;
    object-fit:contain;
    background:#f8f8f8;
    border-radius:10px;
}

.card h3{
    margin-top:18px;
    font-size:20px;
    font-weight:600;
    min-height:55px;
}

.card p{
    margin:10px 0;
    color:#666;
    font-size:15px;
}

.card h4{
    margin:12px 0;
    font-size:22px;
    color:#111;
}

.card button{
    width:100%;
    padding:12px;
    background:#000;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.card button:hover{
    background:#333;
}

.card button:disabled{
    background:#999;
    cursor:not-allowed;
}

.cartBox{
    position:relative;
    cursor:pointer;
}

.cartBox i{
    font-size:22px;
}

#cartCount{
    position:absolute;
    top:-10px;
    right:-10px;
    background:#000;
    color:#fff;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:600;
}


.best-sellers{
    width:90%;
    max-width:1400px;
    margin:50px auto;
}

.best-sellers h1{
    text-align:center;
    font-size:42px;
    margin-bottom:40px;
}

.product-container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}



@media(max-width:992px){

    .navbar{
        padding:0 20px;
    }

    .navLink{
        display:none;
    }

    .product-container{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:576px){

    .product-container{
        grid-template-columns:1fr;
    }

}
        .allProducts{
    width:90%;
    max-width:1400px;
    margin:50px auto 80px;
}

.pageTitle{
    text-align:center;
    margin-bottom:50px;
}

.pageTitle h1{
    font-size:46px;
    font-weight:600;
    margin-bottom:10px;
}

.pageTitle p{
    font-size:18px;
    color:#666;
}

.product-container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

@media(max-width:992px){

    .product-container{
        grid-template-columns:repeat(2,1fr);
    }

    .pageTitle h1{
        font-size:38px;
    }
}

@media(max-width:576px){

    .product-container{
        grid-template-columns:1fr;
    }

    .pageTitle h1{
        font-size:30px;
    }

    .pageTitle p{
        font-size:15px;
    }
}
    </style>

   <section class="allProducts">

    <div class="pageTitle">

<script src="products.js"></script>
   <script>
const allProducts = [
    ...products,
    ...newProducts
];

const container = document.querySelector(".product-container");

allProducts.forEach((product) => {

    let card = document.createElement("div");
    card.className = "card";

    let img = document.createElement("img");
    img.src = product.image;

    let title = document.createElement("h3");
    title.innerText = product.name;

    let desc = document.createElement("p");
    desc.innerText = product.desc;

    let price = document.createElement("h4");
    price.innerText = product.price;

    let btn = document.createElement("button");
    btn.innerText = "Add to Cart";

    //product page
    card.addEventListener("click", function () {

        localStorage.setItem(
            "selectedProduct",
            JSON.stringify(product)
        );

        window.location.href = "product.html";

    });

  //addTocart btn
    btn.addEventListener("click", function (e) {

        e.stopPropagation();   // Prevent opening product page

        addToCart(product);

        btn.innerText = "Added ✓";
        btn.disabled = true;

    });

    card.append(img, title, desc, price, btn);

    container.append(card);

});
function addToCart(product) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(product);

    localStorage.setItem("cart", JSON.stringify(cart));

    updateCartCount();

    alert("Added to Cart");
}

function updateCartCount() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    document.getElementById("cartCount").innerText = cart.length;
}

document.getElementById("cartBtn").onclick = function () {
    window.location.href = "cart.html";
};

updateCartCount();
</script>
